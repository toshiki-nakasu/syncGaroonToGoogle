<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Garoon Calendar Sync</title>
        <link rel="stylesheet" href="shared.css">
        <script type="module" src="popup.js"></script>
    </head>
    <body class="popup">
        <h1>Garoon Calendar Sync</h1>
        <div id="status" role="status" aria-live="polite">
            <strong id="label">確認中</strong>
            <p id="message">接続を確認しています。</p>
        </div>
        <p id="last-success">最終同期: 未実行</p>
        <p id="summary" class="hint"></p>
        <p class="hint">ログイン済みのGaroonタブを開いている間、5分ごとに同期します。</p>
        <button id="sync" class="primary" type="button">今すぐ同期</button>
        <button id="refresh" type="button">状態を確認</button>
        <button id="options" type="button">設定</button>
        <p id="feedback" role="status" aria-live="polite"></p>
    </body>
</html>
