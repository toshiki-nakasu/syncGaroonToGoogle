<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Garoon Calendar Sync</title>
        <link rel="stylesheet" href="shared.css" />
        <script type="module" src="popup.js"></script>
    </head>
    <body class="popup">
        <header class="popup-header">
            <p class="eyebrow">GAROON CALENDAR SYNC</p>
            <h1>カレンダー同期</h1>
        </header>
        <section
            id="status"
            class="sync-status"
            role="status"
            aria-live="polite"
            aria-label="同期ステータス"
        >
            <p class="eyebrow">同期ステータス</p>
            <strong id="label">読み込み中</strong>
            <p id="message" hidden></p>
            <p id="summary" class="hint"></p>
        </section>
        <section class="popup-connections" aria-label="接続と認証ステータス">
            <h2>接続と認証</h2>
            <div class="connection-line">
                <span>Garoon セッション</span
                ><span id="garoon-connection" class="connection-badge"
                    >未確認</span
                >
            </div>
            <p id="garoon-error" class="connection-error" hidden></p>
            <div class="connection-line">
                <span>Google 認証</span
                ><span id="google-connection" class="connection-badge"
                    >未確認</span
                >
            </div>
            <p id="google-error" class="connection-error" hidden></p>
        </section>
        <div class="popup-actions">
            <button id="sync" class="primary" type="button">今すぐ同期</button>
            <button id="auto-sync" type="button" disabled>読み込み中</button>
            <button id="options" type="button">設定を開く</button>
        </div>
        <p
            id="feedback"
            class="feedback"
            role="status"
            aria-live="polite"
            hidden
        ></p>
        <footer id="last-success" class="hint">最終同期: 未実行</footer>
    </body>
</html>
