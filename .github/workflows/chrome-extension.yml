name: Chrome Extension CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source and documentation
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Install Chromium
        run: npm run browser:install:deps
      - name: Run browser tests
        run: npm run test:browser
      - name: Package extension using the tag version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
          REPOSITORY: ${{ github.repository }}
          DOCUMENTATION_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: node script/packageExtension.mjs "$RELEASE_TAG" "$REPOSITORY" dist "$DOCUMENTATION_REF"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-release
          path: dist/garoon-calendar-sync.zip*
          if-no-files-found: error

  updater:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension-release
          path: dist
      - name: Test updater with Windows PowerShell 5.1
        shell: powershell
        run: "& ./script/test/Update.test.ps1 -Package ./dist/garoon-calendar-sync.zip"

  release:
    needs: [validate, updater]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension-release
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'This version is already published. Use a new version tag.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Garoon Calendar Sync $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/garoon-calendar-sync.zip dist/garoon-calendar-sync.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
